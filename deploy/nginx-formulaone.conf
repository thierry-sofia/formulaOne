# /etc/nginx/sites-available/formulaone  (puis lien dans sites-enabled)
# Remplacer formules.example.com par le nom de domaine reel.
server {
    listen 80;
    server_name formules.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name formules.example.com;

    # Certificat (ex. : sudo certbot --nginx -d formules.example.com)
    ssl_certificate     /etc/letsencrypt/live/formules.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formules.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
