# Ecoute uniquement en local : l'acces externe passe par nginx (HTTPS)
server.port=${FORMULAONE_PORT:8095}
server.address=127.0.0.1

# Base maBase : identifiants fournis par variables d'environnement (jamais dans le code)
spring.datasource.url=${FORMULAONE_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=maBase;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${FORMULAONE_DB_USER}
spring.datasource.password=${FORMULAONE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Authentification de l'interface (pas de valeur par defaut : l'appli refuse de demarrer sans)
spring.security.user.name=${FORMULAONE_USER:admin}
spring.security.user.password=${FORMULAONE_PASSWORD}
